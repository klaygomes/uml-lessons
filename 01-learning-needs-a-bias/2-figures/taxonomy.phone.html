<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root {

  --selection: var(--input-soft);
  --code-bg: var(--paper-2);
  --code-text: var(--ink);
  --code-keyword: #83339A;
  --code-string: #2E6B1E;
  --code-number: #8C5300;
  --code-function: #0B6470;
  --code-call: #264F8C;
  --code-builtin: #0B6470;

  --font-body: "Literata", Georgia, serif;

  --text-fig: 12px;

  --text-fig-name: 15px;
  --text-fig-note: 17px;
  --text-fig-math: 18px;
  --text-micro: 13px;
  --text-small: 14.5px;
  --text-caption: 15.5px;
  --text-ui: 16px;
  --text-body: 18px;
  --text-h3: 19px;
  --text-result: 19px;
  --text-lead: clamp(20px, 2.3vw, 23px);
  --text-h2: clamp(25px, 2.9vw, 29px);
  --text-h1: clamp(36px, 5.4vw, 50px);
  --text-table: 14px;
  --text-code: 14.5px;
  --text-math: 1.05em;
  --text-math-display: 1.15em;

  --leading-body: 1.62;

  --leading-caption: 1.5;
  --leading-code: 1.5;

  --space-6: 24px;

  --space-14: 56px;
  --space-18: 72px;
  --space-20: 80px;

  --space-header-gap: var(--space-4);
  --space-crumbs-top: var(--space-8);

  --space-page-bottom: var(--space-20);

@media (max-width: 520px) {

    --code-keyword: #D3A2F2; --code-string: #A3D58F; --code-number: #F4BD68; --code-function: #7CCAD3; --code-call: #A9C4F0; --code-builtin: #7CCAD3; --code-comment: #9C9C97;

}

  --paper: #17181B; --paper-2: #222429; --ink: #ECEAE5; --ink-soft: #A4A39E; --rule: #35373C;
  --accent: #F0A73A; --accent-ink: #F4BD68; --accent-soft: #3B2C12; --input: #79A6E6; --input-soft: #233A5C; --ok: #5FC28E; --ok-soft: #15301F;
    --code-keyword: #D3A2F2; --code-string: #A3D58F; --code-number: #F4BD68; --code-function: #7CCAD3; --code-call: #A9C4F0; --code-builtin: #7CCAD3; --code-comment: #9C9C97;

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: var(--text-body); line-height: var(--leading-body); font-optical-sizing: auto; text-rendering: optimizeLegibility; font-feature-settings: "kern", "liga"; }
::selection { background: var(--selection); color: var(--ink); }
:focus-visible { outline: var(--focus-ring) solid var(--input); outline-offset: var(--space-1); border-radius: 2px; }

.wrap { max-width: calc(var(--measure) + 2 * var(--space-gutter)); margin: 0 auto; padding: 0 max(var(--space-gutter), env(safe-area-inset-right, 0px)) var(--space-page-bottom) max(var(--space-gutter), env(safe-area-inset-left, 0px)); }

.crumbs { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); padding-top: var(--space-crumbs-top); font-family: var(--font-ui); font-size: var(--text-caption); line-height: var(--leading-ui); color: var(--ink-soft); }
.crumbs a { color: var(--ink-soft); }
header { display: grid; gap: var(--space-header-gap); padding-top: var(--space-header-top); }
h1 { font-size: var(--text-h1); line-height: var(--leading-title); letter-spacing: var(--tracking-title); }

section { margin-top: var(--space-section); display: grid; gap: var(--space-block); }

figure { margin: 0; display: grid; gap: var(--space-2); }
figcaption { font-family: var(--font-ui); font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-soft); max-width: var(--measure); }
.diagram { overflow-x: auto; }
section > figure, section > .lab, section > .k-wide { width: min(var(--column), calc(100vw - 2 * var(--space-gutter))); margin-left: calc((100% - min(var(--column), calc(100vw - 2 * var(--space-gutter)))) / 2); }

.lab { display: grid; gap: var(--space-4); border: var(--line-hair) solid var(--rule); border-radius: var(--radius); padding: var(--space-lab); background: var(--paper); font-family: var(--font-ui); font-size: var(--text-ui); line-height: var(--leading-ui); }

.key { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-5); font-size: var(--text-caption); color: var(--ink-soft); }

.table { overflow-x: auto; max-width: 100%; }

.myth { border-left: var(--line-mark) solid var(--accent); padding-left: var(--space-4); display: grid; gap: var(--space-2); }
.myth b { color: var(--accent-ink); }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }

.toc { margin-top: var(--space-header-after); font-family: var(--font-ui); font-size: var(--text-caption); line-height: var(--leading-ui); }

.toc summary { cursor: pointer; width: fit-content; font-weight: var(--weight-bold); color: var(--ink); }
.toc ol { margin: var(--space-3) 0 0; padding-left: 1.6em; columns: 2 16em; column-gap: var(--space-8); }
.toc li { break-inside: avoid; padding-block: calc(var(--space-1) / 2); color: var(--ink-soft); }

html { scroll-behavior: smooth; scroll-padding-top: var(--space-6); }
figcaption { text-wrap: pretty; }
section > figure > figcaption { width: 100%; max-width: var(--measure); margin-inline: auto; }

.k-fig { display: block; width: 100%; height: auto; --k-step: var(--motion-step); }

.k-fig .k-arrow.k-accent { stroke: var(--accent); }

.k-fig .k-num-input { font-family: var(--font-mono); font-size: var(--text-fig); fill: var(--input); font-weight: var(--weight-medium); }

<p class="topic">Lesson 1 · learning needs a bias</p>
<h1>Four ways to sort learning problems</h1>
<div class="diagram"><svg class="k-fig k-narrow" id="fig-taxonomy-phone" viewBox="0 0 360 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="taxonomy-phone-title taxonomy-phone-desc"><title id="taxonomy-phone-title">Four ways to sort learning problems</title><desc id="taxonomy-phone-desc">Four dimensions of learning, each with its settings and a classic example: supervised, reinforcement or unsupervised; passive or active; a helpful, indifferent or adversarial teacher; batch or online; this course's main focus is tinted in each row.</desc><defs><marker id="taxonomy-phone-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="k-head" points="0 0, 8 3, 0 6"/></marker><marker id="taxonomy-phone-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="k-head-accent" points="0 0, 8 3, 0 6"/></marker><marker id="taxonomy-phone-arrow-input" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="k-head-input" points="0 0, 8 3, 0 6"/></marker><pattern id="taxonomy-phone-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="k-hatch-bg"/><line x1="0" y1="0" x2="0" y2="6" class="k-hatch"/></pattern></defs><rect class="k-bg" width="360" height="700"/><text class="k-label" x="16" y="28" text-anchor="start">supervised or not</text><g ><rect class="l1-focus" x="16" y="40" width="328" height="44" rx="4"/><text class="k-name" style="font-size:14px" x="26" y="58" text-anchor="start">supervised</text><text class="k-tick" x="26" y="75" text-anchor="start">the mail filter: junk and keep clicks</text></g><g ><rect class="l1-cell" x="16" y="90" width="328" height="44" rx="4"/><text class="k-name" style="font-size:14px" x="26" y="108" text-anchor="start">reinforcement</text><text class="k-tick" x="26" y="125" text-anchor="start">chess: games labelled with who won</text></g><g ><rect class="l1-cell" x="16" y="140" width="328" height="44" rx="4"/><text class="k-name" style="font-size:14px" x="26" y="158" text-anchor="start">unsupervised</text><text class="k-tick" x="26" y="175" text-anchor="start">anomaly detection, clustering (lesson 22)</text></g><text class="k-label" x="16" y="212" text-anchor="start">active or passive</text><g ><rect class="l1-focus" x="16" y="224" width="328" height="44" rx="4"/><text class="k-name" style="font-size:14px" x="26" y="242" text-anchor="start">passive</text><text class="k-tick" x="26" y="259" text-anchor="start">the mail filter waits for users' labels</text></g><g ><rect class="l1-cell" x="16" y="274" width="328" height="44" rx="4"/><text class="k-name" style="font-size:14px" x="26" y="292" text-anchor="start">active</text><text class="k-tick" x="26" y="309" text-anchor="start">the learner picks or composes messages</text></g><text class="k-label" x="16" y="346" text-anchor="start">what kind of teacher</text><g ><rect class="l1-cell" x="16" y="358" width="328" height="44" rx="4"/><text class="k-name" style="font-size:14px" x="26" y="376" text-anchor="start">helpful</text><text class="k-tick" x="26" y="393" text-anchor="start">a child, a student</text></g><g ><rect class="l1-focus" x="16" y="408" width="328" height="44" rx="4"/><text class="k-name" style="font-size:14px" x="26" y="426" text-anchor="start">indifferent nature</text><text class="k-tick" x="26" y="443" text-anchor="start">what a scientist learns from: statistical</text></g><g ><rect class="l1-cell" x="16" y="458" width="328" height="44" rx="4"/><text class="k-name" style="font-size:14px" x="26" y="476" text-anchor="start">adversarial</text><text class="k-tick" x="26" y="493" text-anchor="start">spammers, fraudsters; also the worst case</text></g><text class="k-label" x="16" y="530" text-anchor="start">batch or online</text><g ><rect class="l1-focus" x="16" y="542" width="328" height="44" rx="4"/><text class="k-name" style="font-size:14px" x="26" y="560" text-anchor="start">batch</text><text class="k-tick" x="26" y="577" text-anchor="start">a data miner with a big archive</text></g><g ><rect class="l1-cell" x="16" y="592" width="328" height="44" rx="4"/><text class="k-name" style="font-size:14px" x="26" y="610" text-anchor="start">online</text><text class="k-tick" x="26" y="627" text-anchor="start">a stockbroker, every day (lesson 21)</text></g><rect class="l1-focus" x="16" y="660" width="22" height="14" rx="3"/><text class="k-label" x="46" y="671" text-anchor="start">this course's main focus</text></svg></div>
